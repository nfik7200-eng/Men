# Temporary HTTP-only server used ONLY to obtain the first certificate (the full config references certificate files that
# do not exist before issuance, so nginx -t would fail on it). NOT syntax-tested. Replace YOUR_DOMAIN, then:
#   certbot certonly --webroot -w /var/www/certbot -d YOUR_DOMAIN --agree-tos -m YOUR_CONTACT
# and afterwards delete this file and install the rendered watchtower.conf.
server {
    listen 80;
    listen [::]:80;
    server_name YOUR_DOMAIN;
    server_tokens off;
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 404; }
}
