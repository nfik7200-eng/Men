# /etc/nginx/conf.d/bip.conf   (example; certificates from certbot or your own CA)
server {
    listen 80;
    server_name bip.example.org;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name bip.example.org;

    ssl_certificate     /etc/letsencrypt/live/bip.example.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/bip.example.org/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    server_tokens off;
    client_max_body_size 1m;

    root /srv/bip/web;

    location /api/ {
        # nginx's worker user must be in group bip to open the socket.
        proxy_pass http://unix:/run/bip/api.sock;
        proxy_set_header Host $host;
        # Replace, never append: BIP trusts the last hop, which must be this proxy's view.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 120s;
    }

    location / {
        try_files $uri /index.html;
    }
}
