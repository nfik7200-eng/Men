# Watchtower reverse proxy. Render with:  deploy/render-nginx.sh --domain shop.my-org.net --out /etc/nginx/conf.d/watchtower.conf
# NOT SYNTAX-TESTED in the authoring session (no nginx binary, no docker daemon). Run `nginx -t` before reloading.
# Goes in conf.d/ (included inside http {}), so limit_req_zone below is valid at top level.
#
# WHY THE HEADERS BELOW MATTER (shopping/web/security.py):
#  * Host $host      : the CSRF check compares the Origin header's host with the request Host. Host must be the PUBLIC
#                      name browsers use (YOUR_DOMAIN), not 127.0.0.1:8000, or every browser POST gets 403.
#  * X-Forwarded-For : set to $remote_addr (overwrite, never append): the app trusts the RIGHTMOST entry when
#                      WATCHTOWER_TRUST_PROXY=1, so a client-forged header can never be the one it sees.
#  * Secure cookies  : uvicorn sees plain http from nginx, so WATCHTOWER_COOKIE_SECURE=1 is REQUIRED in the env file.
#  * The app already sends CSP, X-Frame-Options, nosniff, Referrer-Policy and Permissions-Policy; they are NOT repeated
#    here (duplicates). Only HSTS is added by nginx.

limit_req_zone $binary_remote_addr zone=wt_general:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=wt_login:10m   rate=6r/m;
limit_conn_zone $binary_remote_addr zone=wt_conn:10m;

upstream watchtower_app {
    server 127.0.0.1:8000;
    keepalive 16;
}

# Anything addressed to another Host (or a bare IP) is dropped: keeps scanners off the app and the Host check honest.
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    server_tokens off;
    return 444;
}

# HTTPS equivalent: unknown Host/SNI (or a bare IP) gets no certificate and no app (needs nginx >= 1.19.4)
server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    server_name _;
    ssl_reject_handshake on;
}

server {
    listen 80;
    listen [::]:80;
    server_name YOUR_DOMAIN;
    server_tokens off;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;      # certbot --webroot -w /var/www/certbot -d YOUR_DOMAIN
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;            # works on nginx 1.18+ (Debian 12 / Ubuntu 24.04); newer nginx only warns that it is deprecated
    listen [::]:443 ssl http2;
    server_name YOUR_DOMAIN;
    server_tokens off;

    # Certbot-managed (placeholders resolve once certbot has issued the certificate for YOUR_DOMAIN).
    ssl_certificate     /etc/letsencrypt/live/YOUR_DOMAIN/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/YOUR_DOMAIN/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_timeout 1d;
    ssl_session_cache shared:wt_ssl:10m;
    ssl_session_tickets off;

    add_header Strict-Transport-Security "max-age=31536000" always;   # add "; includeSubDomains" only if you own all subdomains

    # Request limits: the app takes small forms and queries only.
    client_max_body_size 256k;
    client_body_timeout 15s;
    client_header_timeout 15s;
    send_timeout 30s;
    keepalive_timeout 30s;
    large_client_header_buffers 4 8k;
    limit_conn wt_conn 30;
    limit_req_status 429;

    access_log /var/log/nginx/watchtower.access.log;
    error_log  /var/log/nginx/watchtower.error.log warn;

    # Proxy settings (inherited by every location below, none of which sets its own proxy_set_header).
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 5s;
    proxy_send_timeout 30s;
    proxy_read_timeout 60s;
    proxy_redirect http://$host/ https://$host/;   # uvicorn runs with --no-proxy-headers and would otherwise redirect to http://

    # Strictest bucket: admin login (the app has its own 10/min limiter too).
    location = /admin/login {
        limit_req zone=wt_login burst=4 nodelay;
        # Optional: restrict admin to your own address (uncomment and replace; do not invent one):
        # allow YOUR_ADMIN_IP;
        # deny all;
        proxy_pass http://watchtower_app;
    }

    location /admin {
        limit_req zone=wt_general burst=20 nodelay;
        # allow YOUR_ADMIN_IP;
        # deny all;
        proxy_pass http://watchtower_app;
    }

    location / {
        limit_req zone=wt_general burst=40 nodelay;
        proxy_pass http://watchtower_app;
    }
}
