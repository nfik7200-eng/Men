# BIP provider registry (Stage 2). Researched 2026-11-03 via web search of official and
# third-party pages; direct page fetches were blocked in the authoring sandbox.
#
# Rules:
# - Facts not documented are omitted, so they load as "unknown". Never guess.
# - `methods` are the read-only methods BIP is permitted to call through the provider.
#   Write or signing methods are rejected by the loader.
# - `infrastructure` groups providers by operator. Agreement between two providers counts as
#   independent corroboration ONLY if their groups differ (shared infrastructure is not
#   independent). Unknown upstream sharing between different operators cannot be ruled out.
# - `documentation_basis` / `documentation_checked`: how the documented facts below were obtained
#   and when. "search_derived" = web-search summaries of provider pages (direct fetches were
#   blocked); such facts are leads, not verified limits. Observed behaviour comes only from the
#   capability prober and is stored separately (never written back into this file).
# - `client_rps` is BIP's own self-throttle (a politeness policy), NOT a documented provider limit.
# - Credentialed endpoints are read from `endpoint_env` (full URL, treated as a secret). The URL's
#   host must match `allowed_hosts` (exact, or ".suffix" for subdomains). Users cannot supply URLs.

# ---------------------------------------------------------------- Ethereum, keyless

[[provider]]
id = "publicnode-eth"
documentation_basis = "search_derived"
documentation_checked = "2026-11-03"
infrastructure = "allnodes"
name = "PublicNode Ethereum"
operator = "Allnodes"
kind = "rpc"
protocol = "evm-jsonrpc"
chains = ["ethereum"]
network = "mainnet"
access = "public"
endpoint_url = "https://ethereum-rpc.publicnode.com"
allowed_hosts = ["ethereum-rpc.publicnode.com"]
enabled = true
methods = ["eth_chainId", "eth_blockNumber", "eth_getBlockByNumber", "eth_getBalance",
           "eth_getTransactionByHash", "eth_getTransactionReceipt", "eth_getLogs",
           "eth_getTransactionCount", "eth_getCode"]
client_rps = 4.0
rate_limit = "Not published; shared per-IP limits apply (third-party sources)."
docs_url = "https://ethereum.org/developers/tools/publicnode-allnodes/"
terms_url = "https://www.publicnode.com/"
sources = ["https://ethereum.org/developers/tools/publicnode-allnodes/", "https://main.net/status/ethereum/"]
notes = "PublicNode terms (publicnode.com/terms, checked 2026-11-13) forbid data mining, robots, scraping and similar extraction: use only for small, bounded checks, not bulk collection. Free, keyless (ethereum.org listing). Hostname confirmed by a third-party monitor, not by PublicNode's own docs. Archive depth and eth_getLogs range limit unknown."

[[provider]]
id = "ankr-eth"
documentation_basis = "official_docs"
documentation_checked = "2026-11-13"
infrastructure = "ankr"
name = "Ankr Ethereum"
operator = "Ankr"
kind = "rpc"
protocol = "evm-jsonrpc"
chains = ["ethereum"]
network = "mainnet"
access = "credentials"
endpoint_env = "BIP_PROVIDER_ANKR_ETH_URL"
allowed_hosts = ["rpc.ankr.com"]
enabled = true
methods = ["eth_chainId", "eth_blockNumber", "eth_getBlockByNumber", "eth_getBalance",
           "eth_getTransactionByHash", "eth_getTransactionReceipt", "eth_getLogs",
           "eth_getTransactionCount", "eth_getCode"]
client_rps = 4.0
rate_limit = "Public and Freemium: about 1,800 requests/minute; eth_getLogs max 1,000 blocks (Public), max 200,000 logs per response, batch size 10 (Public). WebSocket on Premium only (Ankr service plans, checked 2026-11-13)."
docs_url = "https://www.ankr.com/docs/api-reference/"
terms_url = "https://www.ankr.com/terms/"
sources = ["https://www.ankr.com/docs/rpc-service/service-plans/"]
max_log_block_range = 1000
archive = "yes"
notes = "Current docs put an API key in the URL path (https://rpc.ankr.com/eth/<KEY>). Whether the bare URL still works without a key is unconfirmed, so it is treated as credentialed."

