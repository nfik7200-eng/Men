terms_url = "https://solana.com/tos"
sources = ["https://solana.com/docs/core/clusters", "https://docs.anza.xyz/clusters/available"]
notes = "Official docs call it rate-limited and not intended for production. Current docs name api.mainnet.solana.com; older docs use api.mainnet-beta.solana.com. Historical depth served is unknown. getTokenAccountsByOwner is listed in the official RPC reference (solana.com/docs/rpc/http, read 2026-11-08); not probed live."

