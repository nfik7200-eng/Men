# ---------------------------------------------------------------- Solana, keyless

[[provider]]
id = "solana-public"
documentation_basis = "official_docs"
documentation_checked = "2026-11-13"
infrastructure = "solana-labs"
name = "Solana public mainnet RPC"
operator = "Solana Labs / Solana Foundation"
kind = "rpc"
protocol = "solana-jsonrpc"
chains = ["solana"]
network = "mainnet-beta"
access = "public"
endpoint_url = "https://api.mainnet.solana.com"
allowed_hosts = ["api.mainnet.solana.com", "api.mainnet-beta.solana.com"]
enabled = true
methods = ["getHealth", "getGenesisHash", "getSlot", "getBlock", "getBalance",
           "getSignaturesForAddress", "getTransaction", "getTokenAccountsByOwner", "getVersion", "getBlockHeight",
           "getLatestBlockhash"]
client_rps = 3.0
rate_limit = "100 requests per 10 s per IP, 40 per 10 s per IP for a single RPC, 40 concurrent connections, 40 new connections per 10 s, 100 MB per 30 s (Solana clusters page, checked 2026-11-13). Not for production use."
docs_url = "https://solana.com/docs/references/clusters"
terms_url = "https://solana.com/tos"
sources = ["https://solana.com/docs/core/clusters", "https://docs.anza.xyz/clusters/available"]
notes = "The solana.com site terms forbid systematic retrieval to compile a database and automated use; whether they cover the public RPC endpoint is unclear, so keep runs small and occasional. Official docs call it rate-limited and not intended for production. Current docs name api.mainnet.solana.com; older docs use api.mainnet-beta.solana.com. Historical depth served is unknown. getTokenAccountsByOwner is listed in the official RPC reference (solana.com/docs/rpc/http, read 2026-11-08); not probed live."

